name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Chrome for mobile touch tests
        run: |
          npx puppeteer browsers install chrome
          sudo env "PATH=$PATH" npx puppeteer browsers install chrome --install-deps
      - run: npm test
